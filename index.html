<!DOCTYPE html>
<html>
<head>
	<script>
		const PREFIX = "Balatro_Balatro_";
				const GAME_CACHE_KEY = "game.love.overlay-v1";
		const originalOpen = indexedDB.open;
		const originalDeleteDatabase = indexedDB.deleteDatabase;
		indexedDB.open = function(name, version) {
			const prefixedName = PREFIX + name;
			return version !== undefined
				? originalOpen.call(this, prefixedName, version)
				: originalOpen.call(this, prefixedName);
		};
		indexedDB.deleteDatabase = function(name) {
			return originalDeleteDatabase.call(this, PREFIX + name);
		};
		["keydown", "keypress", "keyup"].forEach(type => {
			window.addEventListener(type, event => {
				const adminOverlay = document.getElementById("adminOverlay");
				if (!adminOverlay || adminOverlay.hidden ||
					!(event.target instanceof HTMLInputElement) || !adminOverlay.contains(event.target)) return;
				if (type === "keydown" && event.target.id === "adminJokerSearch") {
					const list = document.getElementById("adminJokerSuggestions");
					const options = list ? [...list.querySelectorAll("[role=option]")] : [];
					const selectedIndex = options.findIndex(option => option.getAttribute("aria-selected") === "true");
					if (event.key === "ArrowDown" || event.key === "ArrowUp") {
						if (!list.hidden && options.length) {
							event.preventDefault();
							const direction = event.key === "ArrowDown" ? 1 : -1;
							const nextIndex = selectedIndex < 0
								? (direction > 0 ? 0 : options.length - 1)
								: (selectedIndex + direction + options.length) % options.length;
							options.forEach((option, index) => option.setAttribute("aria-selected", String(index === nextIndex)));
							options[nextIndex].scrollIntoView({ block: "nearest" });
						}
					} else if (event.key === "Enter" && !list.hidden && options.length) {
						event.preventDefault();
						const option = options[selectedIndex < 0 ? 0 : selectedIndex];
						event.target.value = option.dataset.value;
						list.hidden = true;
						event.target.setAttribute("aria-expanded", "false");
						document.getElementById("adminStatus").textContent = `Selected ${option.textContent}`;
					} else if (event.key === "Escape" && !list.hidden) {
						event.preventDefault();
						list.hidden = true;
						event.target.setAttribute("aria-expanded", "false");
					}
				}
				event.stopImmediatePropagation();
			}, true);
		});
		["pointerdown", "mousedown"].forEach(type => {
			window.addEventListener(type, event => {
				const adminOverlay = document.getElementById("adminOverlay");
				if (!adminOverlay || adminOverlay.hidden || !(event.target instanceof HTMLElement) ||
					!adminOverlay.contains(event.target)) return;
				event.stopImmediatePropagation();
				if (event.target instanceof HTMLInputElement || event.target instanceof HTMLTextAreaElement) {
					setTimeout(() => event.target.focus({ preventScroll: true }), 0);
				}
			}, true);
		});
	</script>
	<script src="love.min.js"></script>
	<title>Love.js</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
	<style>
		* { box-sizing: border-box; }
		html, body { width: 100%; height: 100%; margin: 0; }
		body { overflow: hidden; background: #10191d; }
		#canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
		.loader-screen {
			position: fixed;
			inset: 0;
			z-index: 2;
			display: grid;
			place-items: center;
			overflow: hidden;
			background: repeating-conic-gradient(from 218deg at 50% 44%, #8b242a 0deg 12deg, #c13b36 12deg 22deg, #302329 22deg 29deg, #075985 29deg 40deg, #087eae 40deg 50deg, #17262d 50deg 58deg);
			opacity: 1;
			transition: opacity 300ms ease;
		}
		.loader-screen::before {
			position: absolute;
			inset: 0;
			z-index: 2;
			background: repeating-linear-gradient(to bottom, transparent 0 3px, rgba(0, 0, 0, .25) 4px);
			content: "";
			pointer-events: none;
		}
		.loader-screen::after {
			position: absolute;
			inset: 0;
			z-index: 2;
			background: radial-gradient(ellipse at center, transparent 34%, rgba(0, 0, 0, .62) 100%);
			box-shadow: inset 0 0 90px rgba(0, 0, 0, .64);
			content: "";
			pointer-events: none;
		}
		.loader-screen[hidden] { display: none; }
		.loader-screen.is-ready { opacity: 0; pointer-events: none; }
		.loader-layout {
			position: relative;
			z-index: 1;
			display: flex;
			width: min(1100px, calc(100vw - 32px));

		}
		.progress-fill {
			position: relative;
			height: 100%;

			transition: width 180ms ease-out;

		.progress-fill::after {
			position: absolute;
			inset: 0;
			background: repeating-linear-gradient(90deg, transparent 0 16px, rgba(255, 255, 255, .18) 16px 19px);
			content: "";
		}
		.loader-screen.is-indeterminate .progress-fill { width: 38%; animation: loading-sweep 1.2s ease-in-out infinite alternate; }
		.loader-footer {

		@keyframes loading-sweep { from { transform: translateX(0); } to { transform: translateX(145%); } }

	</style>
</head>
<body>

	<script>
		function openGameCache() {
			return new Promise((resolve, reject) => {
				const request = indexedDB.open("game_data_cache", 1);
				request.onupgradeneeded = () => request.result.createObjectStore("files");
				request.onsuccess = () => resolve(request.result);
				request.onerror = () => reject(request.error);
			});
		}

		async function readCachedGameData() {
			let database;
			try {
				database = await openGameCache();
				return await new Promise((resolve, reject) => {
					const request = database.transaction("files", "readonly")
						.objectStore("files").get(GAME_CACHE_KEY);
					request.onsuccess = () => resolve(request.result || null);
					request.onerror = () => reject(request.error);
				});
			} catch (error) {
				console.warn("Could not read cached game data:", error);
				return null;
			} finally {
				if (database) database.close();
			}
		}

		async function saveGameData(data) {
			let database;
			try {
				database = await openGameCache();
				await new Promise((resolve, reject) => {
					const transaction = database.transaction("files", "readwrite");
					const store = transaction.objectStore("files");
					store.put(data, GAME_CACHE_KEY);
					store.delete("game.love");
					transaction.oncomplete = resolve;
					transaction.onerror = () => reject(transaction.error);
					transaction.onabort = () => reject(transaction.error);
				});
			} catch (error) {
				console.warn("Could not save game data in the browser cache:", error);
			} finally {
				if (database) database.close();
			}
		}

					const adminToggle = document.getElementById("adminToggle");
					const adminOverlay = document.getElementById("adminOverlay");
					const adminStatus = document.getElementById("adminStatus");

					function setAdminOverlayOpen(open) {
						adminOverlay.hidden = !open;
						adminToggle.setAttribute("aria-expanded", String(open));
						if (open) setTimeout(() => document.getElementById("adminJokerSearch").focus(), 0);
					}

					adminToggle.addEventListener("click", () => setAdminOverlayOpen(adminOverlay.hidden));
					document.getElementById("adminClose").addEventListener("click", () => {
						setAdminOverlayOpen(false);
						adminToggle.focus();
					});
					window.addEventListener("keydown", event => {
						if (event.key === "F2" && document.body.classList.contains("game-ready")) {
							event.preventDefault();
							event.stopImmediatePropagation();
							setAdminOverlayOpen(adminOverlay.hidden);
						} else if (event.key === "Tab" && document.body.classList.contains("game-ready")) {
							event.stopImmediatePropagation();
							if (adminOverlay.hidden) {
								event.preventDefault();
								setAdminOverlayOpen(true);
							}
						}
					}, true);

					function sendAdminCommand(action, ...values) {
						if (typeof Module === "undefined" || !Module.FS_createDataFile) {
							adminStatus.textContent = "Game is not ready";
							return false;
						}
						const fields = [action, ...values.map(value => String(value).replace(/[\t\r\n]/g, " "))];
						const command = new TextEncoder().encode(fields.join("\t"));
						const path = "/home/web_user/love/admin_overlay_command";
						try {
							if (Module.FS_createPath) Module.FS_createPath("/", "home/web_user/love", true, true);
							try { Module.FS_unlink(path); } catch (_) {}
							Module.FS_createDataFile("/home/web_user/love", "admin_overlay_command", command, true, true, true);
							adminStatus.textContent = "Command sent";
							return true;
						} catch (error) {
							console.error("Could not send game command:", error);
							adminStatus.textContent = "Could not send command";
							return false;
						}
					}

					const adminSpeed = document.getElementById("adminSpeed");
					const adminSpeedValue = document.getElementById("adminSpeedValue");
					const adminJokerSearch = document.getElementById("adminJokerSearch");
					const adminJokerSuggestions = document.getElementById("adminJokerSuggestions");
					const jokerNames = [
						"8 Ball", "Abstract Joker", "Acrobat", "Ancient Joker", "Arrowhead", "Astronomer", "Banner", "Baron",
						"Baseball Card", "Blackboard", "Bloodstone", "Blue Joker", "Blueprint", "Bootstraps", "Brainstorm", "Bull",
						"Burglar", "Burnt Joker", "Business Card", "Canio", "Campfire", "Card Sharp", "Cartomancer", "Castle",
						"Cavendish", "Ceremonial Dagger", "Certificate", "Chaos the Clown", "Chicot", "Clever Joker", "Cloud 9",

					function normalizeJokerSearch(value) {
						return value.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
					}
					function renderJokerSuggestions() {
						const query = normalizeJokerSearch(adminJokerSearch.value.trim());
						adminJokerSuggestions.replaceChildren();
						if (!query) {
							adminJokerSuggestions.hidden = true;
							adminJokerSearch.setAttribute("aria-expanded", "false");
							return;
						}
						const matches = jokerNames
							.filter(name => normalizeJokerSearch(name).includes(query))
							.sort((a, b) => Number(!normalizeJokerSearch(a).startsWith(query)) - Number(!normalizeJokerSearch(b).startsWith(query)) || a.localeCompare(b))
							.slice(0, 8);
						for (const name of matches) {
							const option = document.createElement("button");
							option.type = "button";
							option.setAttribute("role", "option");
							option.setAttribute("aria-selected", "false");
							option.dataset.value = name;
							option.textContent = name;
							adminJokerSuggestions.append(option);
						}
						adminJokerSuggestions.hidden = matches.length === 0;
						adminJokerSearch.setAttribute("aria-expanded", String(matches.length > 0));
					}
					adminJokerSearch.addEventListener("input", renderJokerSuggestions);
					adminJokerSearch.addEventListener("focus", renderJokerSuggestions);
					adminJokerSuggestions.addEventListener("click", event => {
						const option = event.target.closest("[role=option]");
						if (!option) return;
						adminJokerSearch.value = option.dataset.value;
						adminJokerSuggestions.hidden = true;
						adminJokerSearch.setAttribute("aria-expanded", "false");
						adminStatus.textContent = `Selected ${option.textContent}`;
						adminJokerSearch.focus();
					});
					adminJokerSearch.addEventListener("blur", () => setTimeout(() => {
						adminJokerSuggestions.hidden = true;
						adminJokerSearch.setAttribute("aria-expanded", "false");
					}, 0));
					adminSpeed.addEventListener("input", () => {
						adminSpeedValue.value = adminSpeed.value;
						adminSpeedValue.textContent = adminSpeed.value;
						sendAdminCommand("speed", adminSpeed.value);
					});
					document.getElementById("adminAddMoney").addEventListener("click", () => {
						const amount = Math.max(1, Math.min(1000000, Math.floor(Number(document.getElementById("adminMoney").value) || 10)));
						sendAdminCommand("money", amount);
					});
					document.getElementById("adminAddJoker").addEventListener("click", () => {
						const search = document.getElementById("adminJokerSearch").value.trim();
						const quantity = Math.max(1, Math.min(100, Math.floor(Number(document.getElementById("adminJokerQuantity").value) || 1)));
						if (!search) {
							adminStatus.textContent = "Enter a Joker name or key";
							return;
						}
						sendAdminCommand("add_joker", search, quantity);
					});
					document.querySelectorAll("[data-admin-action]").forEach(button => {
						button.addEventListener("click", () => sendAdminCommand(button.dataset.adminAction));
					});

					function updateLoading(message, percent, indeterminate = false) {
			const screen = document.getElementById("loadingScreen");
			const value = Math.max(0, Math.min(100, Math.round(percent)));
			document.getElementById("loadingStatus").textContent = message;
			document.getElementById("loadingPercent").textContent = `${value}%`;
			document.getElementById("loadingTrack").setAttribute("aria-valuenow", String(value));
			document.getElementById("loadingFill").style.width = `${value}%`;
			screen.classList.toggle("is-indeterminate", indeterminate);
		}

		function nextPaint() {
			return new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
		}

		async function readResponseText(response, onBytesRead) {
			if (!response.body || !response.body.getReader) return response.text();
			const reader = response.body.getReader();
			const decoder = new TextDecoder();
			let source = "";
			while (true) {
				const { done, value } = await reader.read();
				if (done) break;
				source += decoder.decode(value, { stream: true });
				onBytesRead(value.byteLength);
			}
			return source + decoder.decode();
		}

		(async () => {
			updateLoading("CHECKING SAVE DATA", 2, true);
			let data = await readCachedGameData();
			if (!data) {
				updateLoading("FINDING GAME FILES", 4, true);
				const responses = await Promise.all(Array.from({ length: 8 }, (_, index) =>
					fetch(`module_${String(index + 1).padStart(2, "0")}.js`)
				));
				if (responses.some(response => !response.ok)) {
					throw new Error("Could not load all game files");
				}

				const lengths = responses.map(response => Number(response.headers.get("content-length")) || 0);
				const totalBytes = lengths.every(length => length > 0)
					? lengths.reduce((total, length) => total + length, 0)
					: 0;
				let loadedBytes = 0;
				updateLoading("DOWNLOADING GAME FILES", 5, totalBytes === 0);
				const parts = await Promise.all(responses.map(response => readResponseText(response, bytes => {
					loadedBytes += bytes;
					const progress = totalBytes ? 5 + loadedBytes / totalBytes * 78 : 5;
					updateLoading("DOWNLOADING GAME FILES", progress, totalBytes === 0);
				})));

				updateLoading("ASSEMBLING GAME FILES", 84);
				await nextPaint();
				const moduleScript = document.createElement("script");
				moduleScript.textContent = parts.join("");
				document.head.appendChild(moduleScript);

				updateLoading("PREPARING GAME ARCHIVE", 89, true);
				data = await getSource();
				void saveGameData(data);
			} else {
				updateLoading("RESTORING SAVED GAME", 89, true);
			}

			updateLoading("STARTING GAME", 95, true);
			Module = {
				INITIAL_MEMORY: 2 ** 28,
				canvas: document.getElementById("canvas"),
				printErr: console.error,
				print: message => {
					const text = String(message);
					const prefix = "__BALATRO_ADMIN__:";
					if (text.startsWith(prefix)) adminStatus.textContent = text.slice(prefix.length);
					else console.log(message);
				},
				arguments: ["game.love"]
			};
			Module.preRun = [function() {
				Module.addRunDependency("fp game.love");
				const ptr = Module.getMemory(data.length);
				Module.HEAPU8.set(data, ptr);
				Module.FS_createDataFile("/", "game.love", data, true, true, true);
				Module.removeRunDependency("fp game.love");
			}];
			await Love(Module);
			await nextPaint();
			updateLoading("READY", 100);
			const screen = document.getElementById("loadingScreen");
			screen.classList.add("is-ready");
			setTimeout(() => {
				screen.hidden = true;
				document.body.classList.add("game-ready");
			}, 320);
		})().catch(error => {
			console.error(error);
			updateLoading("LOAD FAILED", 100);
			document.getElementById("loadingPanel").classList.add("has-error");
			document.getElementById("loadingError").textContent = error.message || "The game could not be loaded.";
			document.getElementById("loadingError").hidden = false;
			document.getElementById("loadingRetry").hidden = false;
		});
		document.getElementById("loadingRetry").addEventListener("click", () => location.reload());
	</script>
